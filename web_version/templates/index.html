<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>숫자 인식 프로그램</title>
<style>
  body {
    font-family: "맑은 고딕", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f4f4f4;
    margin: 0;
    padding: 30px 10px;
  }
  h1 { font-size: 18px; margin-bottom: 20px; color: #333; }
  #canvas {
    background: black;
    border: 2px solid #999;
    border-radius: 6px;
    cursor: crosshair;
    touch-action: none;
  }
  .buttons { margin: 15px 0; }
  button {
    width: 120px;
    padding: 8px 0;
    margin: 0 5px;
    font-size: 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #recognize-btn { background: #4CAF50; color: white; }
  #clear-btn { background: #ddd; color: #333; }
  #result { font-size: 28px; font-weight: bold; color: #333; margin-top: 5px; }
  #confidence { font-size: 14px; color: #666; margin-top: 2px; }
</style>
</head>
<body>
  <h1>숫자를 마우스로 그려주세요</h1>
  <canvas id="canvas" width="280" height="280"></canvas>
  <div class="buttons">
    <button id="recognize-btn">인식하기</button>
    <button id="clear-btn">지우기</button>
  </div>
  <div id="result">결과: -</div>
  <div id="confidence"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");
const confidenceEl = document.getElementById("confidence");

const BRUSH_SIZE = 16;
let drawing = false;
let lastX = null;
let lastY = null;

function clearCanvas() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  resultEl.textContent = "결과: -";
  confidenceEl.textContent = "";
}
clearCanvas();

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener("pointerdown", (e) => {
  drawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
});

canvas.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const pos = getPos(e);
  ctx.strokeStyle = "white";
  ctx.lineWidth = BRUSH_SIZE;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  lastX = pos.x;
  lastY = pos.y;
});

window.addEventListener("pointerup", () => { drawing = false; });

document.getElementById("clear-btn").addEventListener("click", clearCanvas);

document.getElementById("recognize-btn").addEventListener("click", async () => {
  const dataUrl = canvas.toDataURL("image/png");
  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl }),
    });
    const data = await res.json();
    if (!res.ok) {
      resultEl.textContent = "결과: -";
      confidenceEl.textContent = data.error || "인식에 실패했습니다.";
      return;
    }
    resultEl.textContent = `결과: ${data.digit}`;
    confidenceEl.textContent = data.confidence != null ? `신뢰도: ${data.confidence}%` : "";
  } catch (err) {
    confidenceEl.textContent = "서버에 연결할 수 없습니다.";
  }
});
</script>
</body>
</html>
